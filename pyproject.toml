[project]
name = "simulator"
version = "0.1.0"
description = "Minimal physics-model rocket simulator"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "streamlit>=1.66.1",
]

[project.scripts]
simulator = "simulator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
# optional telemetry transport (simulator.telemetry publishes JSON Kafka records)
kafka = [
    "confluent-kafka>=2.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
