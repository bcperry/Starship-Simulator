[project]
name = "simulator"
version = "0.1.0"
description = "Minimal physics-model rocket simulator"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
simulator = "simulator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []

[tool.ruff]
line-length = 100
target-version = "py314"
